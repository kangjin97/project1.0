# Netlify hosts the prebuilt Flutter web app. GitHub Actions builds and deploys
# it when the owner starts a manual CI run on main (deploy-web in
# .github/workflows/ci.yml); merging doesn't deploy. Manual fallback:
# ./scripts/build.sh web, then drag app/build/web onto the Netlify dashboard.
# See docs/deployment.md.
[build]
  publish = "app/build/web"

# iOS needs this file served as JSON for Universal Links.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
